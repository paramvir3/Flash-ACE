# Higher-coverage R2 fit using the union of WTMetaD-IB and downhill AL data.
train_file: "data/combined_train.xyz"
valid_file: "data/combined_valid.xyz"
val_split: 0.0
seed: 2026
model_save_path: "models/r2_trace_v2_combined.pt"
save_last_checkpoint: true
plot_training_curves: true
plot_dir: "plots/combined"

r_max: 5.0
l_max: 2
num_radial: 12
hidden_dim: 64
num_layers: 1
architecture_version: 2
correlation_order: 4
correlation_channels: 16
attention_num_heads: 2
attention_key_dim: null
attention_ffn_hidden: null
attention_dropout: 0.03
attention_layer_scale_init: 0.01
attention_distance_penalty: true
radial_basis_type: "bessel"
radial_trainable: false
gaussian_width: 0.5
radial_mlp_hidden: 32
radial_mlp_layers: 2

epochs: 2000
batch_size: 8
learning_rate: 0.0005
optimizer: "muon"
weight_decay: 0.00001
muon_learning_rate: 0.005
muon_aux_learning_rate: 0.0005
muon_momentum: 0.95
muon_ns_steps: 5
muon_ns_dtype: "auto"
muon_nesterov: true
muon_parameter_mode: "hidden"
muon_include: []
muon_exclude: []
muon_aux_betas: [0.9, 0.95]
muon_aux_eps: 1.0e-10
lr_scheduler_t_max: 700
lr_warmup_epochs: 10
lr_warmup_start_factor: 0.1
lr_scheduler_interval: "epoch"
lr_scheduler_use_restarts: false
lr_min: 0.00001
clip_grad_norm: 1.0
use_amp: false
grad_accum_steps: 1
precompute_neighbors: true
random_rotation: true
device: "cpu"
torch_num_threads: 10
torch_num_interop_threads: 1
num_workers: 0
checkpoint_dir: "checkpoints/combined"
checkpoint_interval: 50
early_stopping_patience: 1000
early_stopping_min_epoch: 1000
early_stopping_min_delta: 0.000001
resume_from: null
resume_load_optimizer: false
resume_load_scheduler: false
resume_load_scaler: false
use_checkpoint_energy_shift: true
energy_shift_per_atom: 0.0
atomic_energies: null
solve_atomic_energies: false

energy_weight: 1.0
forces_weight: 1.0
forces_weight_final: 1.0
forces_weight_decay_epochs: 0
stress_weight: 0.0
stress_weight_final: 0.0
stress_weight_ramp_epochs: 0
aux_force_weight: 0.0
aux_stress_weight: 0.0
force_consistency_weight: 0.0
sobolev_weight: 0.0
sobolev_sigma: 0.0
displacement_prob: 0.0
displacement_sigma: 0.0
temperature_scale_start: 1.0
temperature_scale_end: 1.0
temperature_scale_epochs: 0
temperature_force_ref: 0.5
temperature_force_exponent: -0.25

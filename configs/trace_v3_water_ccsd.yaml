# TRACE v3 fixed-environment tensorial cross-attention for the supplied water set.
train_file: "training_examples/water_ccsd/train.xyz"
valid_file: null
val_split: 0.1
split_mode: "blocked"
split_block_size: 25
split_gap: 2
seed: 42
model_save_path: "trace_v3_water_ccsd.pt"
save_last_checkpoint: true
plot_training_curves: true
plot_dir: "trace_v3_water_ccsd_plots"

architecture_version: 3
r_max: 6.0
l_max: 2
num_radial: 12
hidden_dim: 64
num_layers: 2
correlation_order: 4
correlation_channels: 16
radial_basis_type: "bessel"
radial_trainable: false
gaussian_width: 0.5
radial_mlp_hidden: 32
radial_mlp_layers: 2
attention_num_heads: 2
attention_key_dim: null
attention_ffn_hidden: 128
attention_dropout: 0.02
attention_layer_scale_init: 0.01
attention_distance_penalty: true

epochs: 100
batch_size: 4
learning_rate: 0.001
optimizer: "adamw"
weight_decay: 0.00001
lr_scheduler_t_max: 100
lr_min: 0.00005
clip_grad_norm: 1.0
device: "cpu"
torch_num_threads: 10
torch_num_interop_threads: 1
num_workers: 0
precompute_neighbors: true
random_rotation: false
use_amp: false
grad_accum_steps: 1
early_stopping_patience: 20
early_stopping_min_epoch: 25

energy_weight: 1.0
forces_weight: 1.0
forces_weight_final: 1.0
stress_weight: 0.0
stress_weight_final: 0.0
stress_weight_ramp_epochs: 0
sobolev_weight: 0.0
temperature_scale_start: 1.2
temperature_scale_end: 1.0
temperature_scale_epochs: 15
